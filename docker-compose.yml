# 운영(RDS PostgreSQL)과 같은 조건으로 로컬 검증
#   ./gradlew jibBuildTar -Djib.from.platforms=linux/amd64 && docker load -i build/jib-image.tar
#   docker compose up
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation"]
      interval: 3s
      retries: 10

  app:
    image: reservation-app:0.0.1-SNAPSHOT
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservation
      DB_USERNAME: reservation
      DB_PASSWORD: reservation
      APP_FAULT_ERROR_RATE: ${APP_FAULT_ERROR_RATE:-0}
    ports:
      - "8080:8080"
      - "8081:8081"

  # 로컬 전용: 프론트(../frontend) 서빙 + /api 프록시 (CloudFront 대용)
  web:
    image: nginx:1.27-alpine
    depends_on:
      - app
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ../frontend/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
