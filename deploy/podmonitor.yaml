apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: reservation
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app: reservation
  podMetricsEndpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s