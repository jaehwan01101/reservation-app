# DB 접속 정보를 SSM 에서 가져와 K8s Secret(db-credentials)로 만든다. 값은 Git 에 없다.
# SSM 파라미터는 Terraform 30-data 가 만든다 (비밀번호는 상태 파일에 남지 않는 write-only 방식).
# ClusterSecretStore(aws-parameter-store)는 gitops/platform 의 external-secrets-config 가 만든다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0" # Rollout 보다 먼저 만들어져야 파드가 Secret 을 찾는다
spec:
  # 이 간격마다 SSM 을 다시 읽는다. 단 앱은 기동 때만 env 를 읽으므로 갱신 값을 쓰려면 파드 재시작이 필요하다.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_URL
      remoteRef:
        key: /reservation/db/url
    - secretKey: DB_USERNAME
      remoteRef:
        key: /reservation/db/username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /reservation/db/password
