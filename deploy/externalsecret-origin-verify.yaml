# CloudFront 가 붙이는 비밀 헤더 값을 SSM 에서 가져와 K8s Secret(origin-verify)로 만든다. 값은 Git 에 없다.
# SSM 파라미터는 Terraform 60-edge 가 만든다. 앱은 이 값이 헤더와 같은 /api 요청만 통과시킨다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: origin-verify
  annotations:
    argocd.argoproj.io/sync-wave: "0" # Rollout 보다 먼저 만들어져야 파드가 Secret 을 찾는다
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: origin-verify
    creationPolicy: Owner
  data:
    - secretKey: ORIGIN_VERIFY_SECRET
      remoteRef:
        key: /reservation/edge/origin-verify-header